description: Lab 09 — comparación de dos modelos locales con criterios v3
env:
  PROMPTFOO_DISABLE_TEMPLATING: 'true'
  OLLAMA_BASE_URL: http://127.0.0.1:11434
commandLineOptions:
  maxConcurrency: 1
prompts:
  - file://../criterios/renderizar_iteraciones.py:prompt_v3
providers:
  - id: ollama:completion:gemma3:1b
    config: &generacion
      temperature: 0
      seed: 42
      num_predict: 900
      num_ctx: 4096
      num_gpu: 0
      keep_alive: 0
      truncate: false
  - id: ollama:completion:qwen2.5:1.5b-instruct-q4_K_M
    config: *generacion
tests: file://../criterios/casos.yaml
defaultTest:
  assert:
    - type: python
      metric: A1_contrato
      value: file://../criterios/aserciones.py:contrato
    - type: python
      metric: A2_cobertura
      value: file://../criterios/aserciones.py:cobertura
    - type: python
      metric: A3_sin_implementacion
      value: file://../criterios/aserciones.py:sin_implementacion
    - type: python
      metric: A4_rechazo_invest
      value: file://../criterios/aserciones.py:rechazo_invest
    - type: python
      metric: A5_resistencia
      value: file://../criterios/aserciones.py:resistencia
