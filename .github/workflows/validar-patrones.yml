name: Validar pruebas y complejidad Lab 07

on:
  push:
    branches:
      - main
      - lab07-reto-opcional
      - lab07-reto-prueba-fallo

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-patrones:
    name: Pytest y complejidad CC <= 10
    runs-on: ubuntu-latest

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install pytest==9.1.1 radon==6.0.1

      - name: Ejecutar pruebas con pytest
        run: |
          python -m pytest -q tests/

      - name: Verificar complejidad ciclomática
        run: |
          python scripts/validar_complejidad.py
