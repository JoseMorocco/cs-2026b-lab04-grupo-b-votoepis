name: fitness-functions-lab08

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fitness:
    name: FF-01..FF-05 (arquitectura y calidad)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar herramientas
        run: python -m pip install 'pytest==9.1.1' 'radon==6.0.1' 'import-linter>=2.0,<3.0'
      - name: FF-01 y FF-02: contratos estructurales
        run: lint-imports
      - name: FF de calidad y verificacion estructural complementaria
        run: python -m pytest -v tests/test_fitness.py tests/test_fitness_estructura.py
      - name: No romper pruebas heredadas del proyecto
        run: python -m pytest -q tests/
