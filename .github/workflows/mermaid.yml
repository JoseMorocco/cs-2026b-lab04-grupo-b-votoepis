name: Generate Mermaid PNGs

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  generate-mermaid:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Generate PNGs
        shell: bash
        run: |
          set -e
          
          echo '{"args": ["--no-sandbox"]}' > puppeteer-config.json

          find . -type f -name "*.mmd" \
            -not -path "./node_modules/*" \
            -print0 |
          while IFS= read -r -d '' file; do
            output="${file%.mmd}.png"

            echo "Generando: $output"

            mmdc \
              -p puppeteer-config.json \
              -i "$file" \
              -o "$output" \
              -b transparent
          done

      - name: Commit and push generated PNGs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add '**/*.png'

          if git diff --cached --quiet; then
            echo "No hay cambios en los archivos PNG."
            exit 0
          fi

          git commit -m "docs: actualizar diagramas Mermaid"
          git push